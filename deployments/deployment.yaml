apiVersion: apps/v1
kind: Deployment
metadata:
  name: mondaynightpoker-server
  labels:
    app: mondaynightpoker-server
spec:
  selector:
    matchLabels:
      app: mondaynightpoker-server
  template:
    metadata:
      labels:
        app: mondaynightpoker-server
    spec:
      imagePullSecrets:
        - name: github
      containers:
        - name: mondaynightpoker-server
          image: ghcr.io/weters/mondaynightpoker-server/mondaynightpoker-server:latest
          readinessProbe:
            httpGet:
              port: 5080
              path: /health
          livenessProbe:
            httpGet:
              port: 5080
              path: /health
          volumeMounts:
            - mountPath: /app/.keys
              name: keys
          env:
            - name: MNP_RECAPTCHA_SECRET
              valueFrom:
                secretKeyRef:
                  name: mondaynightpoker-server-config
                  key: recaptcha_secret
            - name: MNP_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: mondaynightpoker-server-config
                  key: pg_dsn
            - name: MNP_EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: email_password
                  name: mondaynightpoker-server-config
            - name: MNP_LOG_LEVEL
              value: DEBUG
            # Public base URL of this API server. Used as the OAuth issuer and
            # MCP resource identifier, so it must be the host MCP clients
            # connect to -- not MNP_HOST, which is the player-facing website.
            - name: MNP_PUBLIC_URL
              value: https://api.mondaynight.bid
      volumes:
        - name: keys
          secret:
            secretName: mondaynightpoker-server-keys
